<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gameplay clips — TORY MINDli</title><link rel="stylesheet" href="style.css"><style>.clip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{background:#fffef9;border:1px solid #cbd2c5;border-radius:20px;padding:20px}video{width:100%;height:auto;max-height:530px;background:#07121f;border-radius:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 system-ui}article a{display:block;margin:12px 0}@media(max-width:720px){.clip-grid{grid-template-columns:1fr}}</style><header><a class="brand" href="/">TORY MINDli</a><select id="lang" aria-label="Language"><option value="en">EN</option><option value="sk">SK</option><option value="cs">CS</option><option value="de">DE</option><option value="ja">JA</option><option value="tr">TR</option><option value="pl">PL</option><option value="hu">HU</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option><option value="pt">PT</option></select></header><main><h1 id="title"></h1><p id="intro"></p><div class="clip-grid" id="clips"></div><footer id="note"></footer></main><script type="module">const labels={"en":["Gameplay clips","Download video","Play the preview"],"sk":["Herné ukážky","Stiahnuť video","Zahrať ochutnávku"],"cs":["Herní ukázky","Stáhnout video","Zahrát ukázku"],"de":["Spielszenen","Video herunterladen","Vorschau spielen"],"ja":["プレイ動画","動画をダウンロード","体験版を遊ぶ"],"tr":["Oynanış videoları","Videoyu indir","Önizlemeyi oyna"],"pl":["Filmy z gry","Pobierz film","Zagraj w wersję próbną"],"hu":["Játékmenet-videók","Videó letöltése","Bemutató indítása"],"fr":["Vidéos de jeu","Télécharger la vidéo","Jouer à la démo"],"es":["Vídeos del juego","Descargar vídeo","Jugar a la demo"],"it":["Video di gioco","Scarica il video","Gioca alla demo"],"pt":["Vídeos do jogo","Descarregar vídeo","Jogar a demo"]};const [clips,words]=await Promise.all([fetch('clips.json').then(r=>r.json()),fetch('i18n.json').then(r=>r.json())]);let lang=new URLSearchParams(location.search).get('lang')||'en';if(!labels[lang])lang='en';const select=document.getElementById('lang');function render(){document.documentElement.lang=lang;select.value=lang;document.getElementById('title').textContent=labels[lang][0];document.getElementById('intro').textContent=words[lang].tag;document.getElementById('note').textContent=words[lang].demo;const host=document.getElementById('clips');host.replaceChildren();clips.filter(c=>c.language===lang).forEach(c=>{const a=document.createElement('article'),h=document.createElement('h2'),v=document.createElement('video'),download=document.createElement('a'),play=document.createElement('a'),body=document.createElement('pre');h.textContent=c.game;v.controls=true;v.preload='none';v.playsInline=true;v.src=c.file;download.href=c.file;download.download=c.file.split('/').pop();download.textContent=labels[lang][1];play.href=c.preview;play.className='primary';play.textContent=labels[lang][2];body.textContent=c.caption;a.append(h,v,play,download,body);host.append(a);});}select.onchange=e=>{lang=e.target.value;history.replaceState(null,'','?lang='+lang);render()};render();</script></html>
